<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RinnePad - Web PDF Editor</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 sm:px-6 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center space-x-3 min-w-0">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold flex items-center justify-center w-10 h-10 shrink-0">
                <i class="fa-solid fa-pen-nib"></i>
            </div>
            <div class="min-w-0">
                <h1 class="text-lg font-semibold tracking-wide">RinnePad</h1>
                <p id="file-name" class="text-xs text-slate-400 truncate">Web PDF Editor</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
            <label class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-sm rounded-md transition cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-folder-open"></i><span class="hidden sm:inline">Open</span>
                <input type="file" id="file-input" class="hidden" accept=".pdf,application/pdf">
            </label>
            <button id="btn-download" disabled class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-sm font-medium rounded-md transition flex items-center space-x-1.5 shadow-lg">
                <i class="fa-solid fa-download"></i><span>Download</span>
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div id="toolbar" class="bg-slate-800/70 border-b border-slate-700 px-3 py-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
        <button id="btn-sidebar" title="Toggle pages" class="md:hidden tb px-2 py-1 rounded bg-slate-700 hover:bg-slate-600"><i class="fa-solid fa-table-cells-large"></i></button>
        <div id="tools" class="flex items-center gap-1">
            <button data-tool="select" title="Select / move / resize" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-arrow-pointer"></i></button>
            <button data-tool="text" title="Text" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-font"></i></button>
            <button data-tool="highlight" title="Highlight" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-highlighter"></i></button>
            <button data-tool="rect" title="Rectangle" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-regular fa-square"></i></button>
            <button data-tool="ellipse" title="Ellipse" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-regular fa-circle"></i></button>
            <button data-tool="line" title="Line" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-minus"></i></button>
            <button data-tool="arrow" title="Arrow" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-arrow-right-long"></i></button>
            <button data-tool="pen" title="Freehand pen" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-pen"></i></button>
            <button data-tool="whiteout" title="Whiteout (covers visually only; text underneath stays in the file, not redaction)" class="tb tool px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-eraser"></i></button>
            <button id="btn-image" title="Insert image" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-regular fa-image"></i></button>
            <input type="file" id="image-input" class="hidden" accept="image/*">
        </div>
        <div class="flex items-center gap-2">
            <select id="in-font" title="Font" class="tb bg-slate-700 rounded px-1 py-1 text-xs">
                <option>Helvetica</option><option>Times</option><option>Courier</option>
            </select>
            <input id="in-size" title="Font size" type="number" min="4" max="200" value="14" class="tb bg-slate-700 rounded px-1 py-1 text-xs w-14">
            <input id="in-color" title="Colour" type="color" value="#000000" class="tb w-7 h-7 bg-transparent cursor-pointer">
            <input id="in-width" title="Stroke width" type="number" min="0.5" max="40" step="0.5" value="2" class="tb bg-slate-700 rounded px-1 py-1 text-xs w-14">
        </div>
        <div class="flex items-center gap-1">
            <button id="btn-add-page" title="Add blank page after current" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-file-circle-plus"></i></button>
            <button id="btn-undo" title="Undo (Ctrl+Z)" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-rotate-left"></i></button>
            <button id="btn-redo" title="Redo (Ctrl+Shift+Z)" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div class="flex items-center gap-1">
            <button id="btn-zoom-out" title="Zoom out" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <span id="zoom-label" class="text-xs w-10 text-center text-slate-300">100%</span>
            <button id="btn-zoom-in" title="Zoom in" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button id="btn-fit" title="Fit width" class="tb px-2 py-1 rounded hover:bg-slate-600"><i class="fa-solid fa-arrows-left-right-to-line"></i></button>
        </div>
        <div class="flex items-center gap-1 text-xs text-slate-300">
            <input id="page-input" title="Jump to page" type="number" min="1" value="1" class="tb bg-slate-700 rounded px-1 py-1 w-14 text-slate-100">
            <span>/ <span id="page-count">0</span></span>
        </div>
    </div>

    <!-- Error banner -->
    <div id="error-banner" role="alert" class="hidden bg-red-900/80 border-b border-red-700 text-red-100 text-sm px-4 py-2 flex items-center justify-between gap-3">
        <span id="error-text"></span>
        <button id="error-close" title="Dismiss" class="shrink-0 px-2"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Main -->
    <div class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" class="hidden md:flex absolute md:static inset-y-0 left-0 z-20 w-40 shrink-0 flex-col bg-slate-800 border-r border-slate-700 overflow-y-auto">
            <div id="thumbs" class="p-2 space-y-3"></div>
        </aside>
        <main id="viewer" class="flex-1 relative overflow-auto bg-slate-950">
            <div id="pages" class="flex flex-col items-center gap-4 p-4"></div>
            <div id="empty" class="absolute inset-0 flex items-center justify-center p-6">
                <div class="text-center max-w-md border-2 border-dashed border-slate-700 rounded-2xl p-10">
                    <div class="text-5xl text-indigo-400 mb-4"><i class="fa-solid fa-file-pdf"></i></div>
                    <h2 class="text-xl font-semibold mb-2">Edit a PDF in your browser</h2>
                    <p class="text-sm text-slate-400 mb-5">Drop a PDF anywhere on this page, or choose a file. It never leaves your device.</p>
                    <label class="inline-flex items-center space-x-2 px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-md text-sm font-medium cursor-pointer shadow-lg">
                        <i class="fa-solid fa-folder-open"></i><span>Open a PDF</span>
                        <input type="file" id="file-input-empty" class="hidden" accept=".pdf,application/pdf">
                    </label>
                </div>
            </div>
        </main>
        <div id="drop-overlay" class="hidden fixed inset-0 z-50 bg-indigo-900/70 border-4 border-dashed border-indigo-300 items-center justify-center text-2xl font-semibold pointer-events-none">Drop PDF to open</div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 px-6 py-2 text-xs text-slate-500 flex justify-between gap-3">
        <div class="truncate">RinnePad v2.0.0 • Hosted on GitHub Pages • Files stay in your browser</div>
        <div id="status-msg" class="text-indigo-400 truncate">Ready</div>
    </footer>

    <script type="module" src="editor.js"></script>
</body>
</html>
